<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>You're Invited!</h1>
            <h2>To the wedding of</h2>
            <h1 class="names">Alex & Taylor</h1>
        </header>

        <section class="details">
            <div class="date-time">
                <h3>When</h3>
                <p>Saturday, October 24th, 2026</p>
                <p>4:00 PM</p>
            </div>
            <div class="location">
                <h3>Where</h3>
                <p>The Grand Garden</p>
                <p>123 Beautiful Lane, City, State</p>
            </div>
        </section>

        <section class="rsvp">
            <h3>RSVP</h3>
            <p>Please let us know if you can make it by September 15th, 2026.</p>
            <button class="rsvp-btn">RSVP Now</button>
        </section>
    </div>
</body>
</html>
